<svg width="200" height="200" viewBox="0 0 200 200" fill="black" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="200" fill="white"/>
  <!-- 左上角定位图案 -->
  <rect x="20" y="20" width="60" height="60" fill="black"/>
  <rect x="32" y="32" width="36" height="36" fill="white"/>
  <rect x="44" y="44" width="12" height="12" fill="black"/>
  <!-- 右上角定位图案 -->
  <rect x="120" y="20" width="60" height="60" fill="black"/>
  <rect x="132" y="32" width="36" height="36" fill="white"/>
  <rect x="144" y="44" width="12" height="12" fill="black"/>
  <!-- 左下角定位图案 -->
  <rect x="20" y="120" width="60" height="60" fill="black"/>
  <rect x="32" y="132" width="36" height="36" fill="white"/>
  <rect x="44" y="144" width="12" height="12" fill="black"/>
  <!-- 数据区域示例 -->
  <rect x="92" y="92" width="16" height="16" fill="black"/>
  <rect x="120" y="92" width="16" height="16" fill="black"/>
  <rect x="92" y="120" width="16" height="16" fill="black"/>
  <rect x="148" y="148" width="12" height="12" fill="black"/>
  <rect x="92" y="20" width="16" height="16" fill="black"/>
  <rect x="20" y="92" width="16" height="16" fill="black"/>
</svg>