<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 宝箱底部 -->
  <rect x="15" y="55" width="90" height="40" rx="10" fill="url(#goldGradient)" stroke="#FFD700" stroke-width="2"/>
  
  <!-- 宝箱顶部 -->
  <path d="M25 55H95L85 35H35L25 55Z" fill="url(#goldGradient)" stroke="#FFD700" stroke-width="2"/>
  
  <!-- 宝箱锁 -->
  <circle cx="60" cy="55" r="8" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  <rect x="57" y="55" width="6" height="15" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  
  <!-- 宝箱装饰 -->
  <rect x="25" y="65" width="70" height="1" fill="#FFD700"/>
  <rect x="25" y="80" width="70" height="1" fill="#FFD700"/>
  
  <!-- 宝箱内部光芒 -->
  <ellipse cx="60" cy="75" rx="30" ry="15" fill="#FFFF00" opacity="0.3"/>
  
  <!-- 金币 -->
  <circle cx="50" cy="70" r="5" fill="#FFD700" stroke="#FFA500"/>
  <circle cx="60" cy="65" r="6" fill="#FFD700" stroke="#FFA500"/>
  <circle cx="70" cy="75" r="5" fill="#FFD700" stroke="#FFA500"/>
  <circle cx="55" cy="80" r="4" fill="#FFD700" stroke="#FFA500"/>
  <circle cx="65" cy="85" r="4" fill="#FFD700" stroke="#FFA500"/>
  
  <!-- 发光效果 -->
  <circle cx="60" cy="65" r="25" fill="none" stroke="#FFFF00" stroke-width="1" opacity="0.2"/>
  <circle cx="60" cy="65" r="35" fill="none" stroke="#FFFF00" stroke-width="1" opacity="0.1"/>
  
  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="goldGradient" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
  </defs>
</svg>